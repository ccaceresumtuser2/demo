name: CI - Build y Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Descarga el código del repo en el runner
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Instala Java 21 y guarda en caché las dependencias de Maven
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3. Da permiso de ejecución al Maven Wrapper
      - name: Permisos para mvnw
        run: chmod +x mvnw

      # 4. Compila y ejecuta las pruebas
      - name: Compilar y probar
        run: ./mvnw -B clean verify

      # 5. Guarda el JAR generado para poder descargarlo
      - name: Subir JAR como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ms-demo-jar
          path: target/*.jar
  docker:
    runs-on: ubuntu-latest
    needs: build              # solo corre si 'build' terminó bien
    steps:
      - uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: docker build -t ms-demo:${{ github.sha }} .